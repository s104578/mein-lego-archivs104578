<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brickset Collector Cloud PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); }
        .set-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: relative; }
        .set-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); }
        .delete-btn { opacity: 0; transition: all 0.2s; }
        .set-card:hover .delete-btn { opacity: 1; }
        .select-checkbox { opacity: 0; transition: all 0.2s; transform: scale(1.2); cursor: pointer; }
        .set-card:hover .select-checkbox, .select-checkbox:checked { opacity: 1; }
        #detailModal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        
        .subtheme-ucs { background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); color: #000; font-weight: 900; }
        .subtheme-technic { background: #475569; color: white; }
        .subtheme-default { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div id="actionBar" class="fixed top-0 left-0 right-0 z-[60] bg-blue-600 text-white py-4 px-6 shadow-2xl hidden">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <span id="selectedCount" class="bg-white text-blue-600 px-3 py-1 rounded-full font-black text-sm">0</span>
                <p class="font-bold">Sets ausgewählt</p>
                <button onclick="clearSelection()" class="text-blue-100 hover:text-white text-xs underline">Aufheben</button>
            </div>
            <div class="flex items-center gap-3">
                <select id="bulkStatus" class="bg-blue-700 rounded-lg px-3 py-2 text-sm font-bold outline-none border-none">
                    <option value="">Zustand...</option>
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                </select>
                <button onclick="applyBulkActions()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-black text-sm">Anwenden</button>
                <button onclick="deleteSelected()" class="bg-red-500 p-2 rounded-lg"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 z-10">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="md:w-1/2 bg-slate-50 p-8 flex flex-col items-center justify-center border-r border-slate-100">
                <img id="modalImg" src="" class="max-h-64 object-contain drop-shadow-2xl mb-8">
                <div class="w-full text-center md:text-left">
                    <p class="text-xs font-black text-blue-600 uppercase tracking-widest" id="modalTheme"></p>
                    <h2 class="text-2xl font-extrabold text-slate-800" id="modalName"></h2>
                    <p class="text-slate-400 font-bold" id="modalId"></p>
                </div>
            </div>
            <div class="md:w-1/2 p-8 pt-12 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Original UVP (€)</p>
                        <input type="number" id="editRetailPrice" step="0.01" class="bg-transparent font-bold text-slate-600 w-full outline-none">
                    </div>
                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                        <p class="text-[10px] font-black text-blue-500 uppercase">Marktwert (€)</p>
                        <input type="number" id="editCurrentValue" step="0.01" class="bg-transparent font-bold text-blue-700 w-full outline-none text-xl">
                    </div>
                </div>
                <div class="flex gap-3">
                    <button onclick="setStatus('New')" id="btnNew" class="flex-1 py-3 rounded-xl border-2 font-bold">New</button>
                    <button onclick="setStatus('Used')" id="btnUsed" class="flex-1 py-3 rounded-xl border-2 font-bold">Used</button>
                </div>
                <button onclick="saveDetails()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-blue-700 transition-all">Speichern</button>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass mb-8 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">BRICKSET<span class="text-blue-600">CLOUD</span></h1>
            <div class="flex gap-6 items-center">
                <div class="text-center"><p class="text-[10px] uppercase font-black text-slate-400">Sets</p><p id="statSets" class="font-bold">0</p></div>
                <div class="text-center"><p class="text-[10px] uppercase font-black text-slate-400">Wert</p><p id="statValue" class="font-bold text-blue-600">0.00 €</p></div>
                <button onclick="exportCSV()" class="p-2 text-slate-400 hover:text-blue-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <div class="max-w-3xl mx-auto mb-12">
            <div class="bg-white p-2 rounded-[2.5rem] shadow-2xl flex items-center border-4 border-white">
                <input type="text" id="barcodeInput" class="flex-1 pl-8 py-4 text-xl outline-none" placeholder="Set-Nr scannen...">
                <button onclick="fetchFromBrickset()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-[2rem] transition-all">Hinzufügen</button>
            </div>
            <p id="apiStatus" class="text-center mt-4 text-[10px] font-black text-slate-400 uppercase italic">Bereit</p>
        </div>
        <div id="library" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <script>
        const BRICKSET_KEY = '3-N4Lr-Ug0H-M49ki';
        const BRICKLINK_KEY = '97ECB800C6634D9F90CB476F53E65973';
        
        let mySets = JSON.parse(localStorage.getItem('bricksetCollection')) || [];
        let selectedSets = new Set();
        let currentEditId = null;
        let currentStatus = "Used";

        document.getElementById('barcodeInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchFromBrickset(); });

        async function fetchFromBrickset() {
            const query = document.getElementById('barcodeInput').value.trim();
            if (!query) return;
            updateStatus("Suche läuft...", "text-blue-500 animate-pulse");
            
            const url = `https://brickset.com/api/v3.asmx/getSets?apiKey=${BRICKSET_KEY}&userHash=&params={'query':'${query}'}`;
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const dataRaw = await response.json();
                const data = JSON.parse(dataRaw.contents);
                
                if (data.status === "success" && data.matches > 0) {
                    await addSetLogic(data.sets[0]);
                    document.getElementById('barcodeInput').value = '';
                } else { updateStatus("Kein Treffer", "text-orange-500"); }
            } catch (e) { updateStatus("Verbindungsfehler", "text-red-600"); }
        }

        async function addSetLogic(set) {
            if (mySets.some(s => s.setNumber === String(set.number))) return updateStatus("Bereits vorhanden", "text-orange-400");

            // 1. RRP / UVP Logik: Prio DE -> Fallback US (1:1)
            let retailPrice = 0;
            if (set.LEGOCom?.DE?.retailPrice) {
                retailPrice = parseFloat(set.LEGOCom.DE.retailPrice);
            } else if (set.LEGOCom?.US?.retailPrice) {
                retailPrice = parseFloat(set.LEGOCom.US.retailPrice); // 1:1 USD -> EUR
            }

            // 2. Marktwert Logik: Brickset -> Fallback BrickLink
            let marketValue = 0;
            if (set.collection?.currentValue) {
                marketValue = parseFloat(set.collection.currentValue);
            } else {
                updateStatus("Hole BrickLink Daten...", "text-blue-400");
                marketValue = await getBrickLinkPrice(set.number);
                if (marketValue === 0) marketValue = retailPrice; // Letzter Fallback
            }

            mySets.unshift({
                setNumber: String(set.number),
                name: set.name,
                theme: set.theme,
                subtheme: set.subtheme || "",
                pieces: set.pieces || 0,
                image: set.image?.imageURL || 'https://via.placeholder.com/300x200',
                price: retailPrice,
                currentValue: marketValue,
                status: "Used",
                addedAt: new Date().toLocaleDateString()
            });

            saveAndRender();
            updateStatus("Erfolgreich hinzugefügt", "text-green-600");
        }

        async function getBrickLinkPrice(num) {
            // Price Guide für Used Sets, Durchschnitt der letzten 6 Monate
            const blUrl = `https://api.bricklink.com/api/store/v1/items/SET/${num}/price?guide_type=sold&new_or_used=U`;
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(blUrl)}`, {
                    headers: { "Authorization": `Status ${BRICKLINK_KEY}` }
                });
                const res = await response.json();
                const data = JSON.parse(res.contents);
                return data?.data?.avg_sold_price ? parseFloat(data.data.avg_sold_price) : 0;
            } catch (e) { return 0; }
        }

        // --- UI & Storage Functions ---
        function saveAndRender() {
            localStorage.setItem('bricksetCollection', JSON.stringify(mySets));
            updateStats();
            renderLibrary();
        }

        function updateStats() {
            const val = mySets.reduce((sum, s) => sum + (parseFloat(s.currentValue) || 0), 0);
            document.getElementById('statSets').innerText = mySets.length;
            document.getElementById('statValue').innerText = val.toFixed(2) + " €";
        }

        function renderLibrary() {
            const container = document.getElementById('library');
            container.innerHTML = mySets.map(set => `
                <div onclick="openModal('${set.setNumber}')" class="set-card bg-white rounded-[2rem] shadow-lg border border-slate-100 overflow-hidden">
                    <input type="checkbox" ${selectedSets.has(set.setNumber) ? 'checked' : ''} onclick="toggleSelection('${set.setNumber}', event)" 
                           class="select-checkbox absolute top-5 left-5 z-20 w-5 h-5 rounded border-blue-500 accent-blue-600">
                    <button onclick="deleteSet('${set.setNumber}', event)" class="delete-btn absolute top-4 right-4 bg-red-500 text-white p-2 rounded-xl z-10">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    <div class="h-44 flex items-center justify-center p-6 bg-white relative">
                        <img src="${set.image}" class="max-h-full drop-shadow-xl">
                        <div class="absolute bottom-2 left-4 flex gap-1">
                            <span class="text-[8px] font-bold px-2 py-0.5 rounded-full ${set.status === 'New' ? 'bg-blue-600' : 'bg-slate-700'} text-white uppercase">${set.status}</span>
                        </div>
                    </div>
                    <div class="p-6 pt-2">
                        <span class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase">${set.theme}</span>
                        <h3 class="font-bold text-slate-800 leading-tight mb-4 h-10 overflow-hidden text-sm mt-2">${set.name}</h3>
                        <div class="flex justify-between items-end border-t border-slate-50 pt-4">
                            <div class="text-[10px] text-slate-400 font-bold">
                                <p class="text-slate-700">#${set.setNumber}</p>
                                <p>UVP: ${set.price.toFixed(2)} €</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs font-black text-slate-400 uppercase">Marktwert</p>
                                <p class="text-xl font-extrabold text-blue-600">${set.currentValue.toFixed(2)} €</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id) {
            const set = mySets.find(s => s.setNumber === String(id));
            if(!set) return;
            currentEditId = String(id);
            document.getElementById('modalImg').src = set.image;
            document.getElementById('modalName').innerText = set.name;
            document.getElementById('modalTheme').innerText = set.theme;
            document.getElementById('modalId').innerText = "#" + set.setNumber;
            document.getElementById('editRetailPrice').value = set.price;
            document.getElementById('editCurrentValue').value = set.currentValue;
            setStatus(set.status || "Used");
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

        function setStatus(s) {
            currentStatus = s;
            document.getElementById('btnNew').className = s === 'New' ? "flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold" : "flex-1 py-3 rounded-xl border-2 text-slate-400 font-bold";
            document.getElementById('btnUsed').className = s === 'Used' ? "flex-1 py-3 rounded-xl bg-slate-800 text-white font-bold" : "flex-1 py-3 rounded-xl border-2 text-slate-400 font-bold";
        }

        function saveDetails() {
            const set = mySets.find(s => s.setNumber === currentEditId);
            if(set) {
                set.price = parseFloat(document.getElementById('editRetailPrice').value) || 0;
                set.currentValue = parseFloat(document.getElementById('editCurrentValue').value) || 0;
                set.status = currentStatus;
                saveAndRender();
                closeModal();
            }
        }

        function toggleSelection(id, e) {
            e.stopPropagation();
            if(selectedSets.has(id)) selectedSets.delete(id);
            else selectedSets.add(id);
            document.getElementById('actionBar').classList.toggle('hidden', selectedSets.size === 0);
            document.getElementById('selectedCount').innerText = selectedSets.size;
        }

        function clearSelection() {
            selectedSets.clear();
            document.getElementById('actionBar').classList.add('hidden');
            renderLibrary();
        }

        function deleteSelected() {
            if(confirm("Markierte Sets löschen?")) {
                mySets = mySets.filter(s => !selectedSets.has(s.setNumber));
                clearSelection();
                saveAndRender();
            }
        }

        function deleteSet(num, e) {
            e.stopPropagation();
            mySets = mySets.filter(s => s.setNumber !== String(num));
            saveAndRender();
        }

        function updateStatus(msg, cls) {
            const el = document.getElementById('apiStatus');
            el.innerText = msg;
            el.className = `text-center mt-4 text-[10px] font-black uppercase italic ${cls}`;
        }

        function exportCSV() {
            let csv = "Set-Nr;Name;UVP;Marktwert;Zustand\n";
            mySets.forEach(s => csv += `${s.setNumber};${s.name};${s.price};${s.currentValue};${s.status}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'LEGO_Collection.csv';
            a.click();
        }

        // Init
        saveAndRender();
    </script>
</body>
</html>
