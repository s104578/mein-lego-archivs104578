<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brickset Collector Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); }
        .set-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .set-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); }
        .delete-btn { opacity: 0; transition: all 0.2s; }
        .set-card:hover .delete-btn { opacity: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-card { animation: fadeIn 0.3s ease-out forwards; }
        /* FIX: Modal explizit unsichtbar beim Start */
        #detailModal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div id="detailModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative animate-card">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 z-10">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="md:w-1/2 bg-slate-50 p-8 flex flex-col items-center justify-center border-r border-slate-100">
                <img id="modalImg" src="" class="max-h-64 object-contain drop-shadow-2xl mb-8">
                <div class="w-full space-y-2 text-center md:text-left">
                    <p class="text-xs font-black text-blue-600 uppercase tracking-widest" id="modalTheme"></p>
                    <h2 class="text-2xl font-extrabold text-slate-800" id="modalName"></h2>
                    <p class="text-slate-400 font-bold" id="modalId"></p>
                </div>
            </div>

            <div class="md:w-1/2 p-8 pt-12 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase">RRP (UVP)</p>
                        <input type="number" id="editPrice" step="0.01" class="bg-transparent font-bold text-slate-800 w-full outline-none">
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Subtheme</p>
                        <input type="text" id="editSubtheme" class="bg-transparent font-bold text-slate-800 w-full outline-none" placeholder="-">
                    </div>
                </div>

                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Zustand</p>
                    <div class="flex gap-3">
                        <button onclick="setStatus('New')" id="btnNew" class="flex-1 py-3 rounded-xl border-2 font-bold transition-all">New</button>
                        <button onclick="setStatus('Used')" id="btnUsed" class="flex-1 py-3 rounded-xl border-2 font-bold transition-all">Used</button>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100 flex justify-between items-center">
                    <button onclick="saveDetails()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">Speichern</button>
                    <div class="text-right">
                        <p class="text-[10px] font-black text-slate-300 uppercase">Hinzugefügt am</p>
                        <p class="text-sm font-bold text-slate-500" id="modalDate"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass mb-8 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-200">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">BRICKSET<span class="text-blue-600">CLOUD</span></h1>
            </div>

            <div class="flex gap-6 text-center">
                <div><p class="text-[10px] uppercase font-black text-slate-400">Sets</p><p id="statSets" class="font-bold text-slate-800">0</p></div>
                <div><p class="text-[10px] uppercase font-black text-slate-400">Teile</p><p id="statParts" class="font-bold text-slate-800">0</p></div>
                <div><p class="text-[10px] uppercase font-black text-slate-400">Gesamtwert</p><p id="statValue" class="font-bold text-blue-600">0.00 €</p></div>
            </div>

            <div class="flex gap-2">
                <button onclick="document.getElementById('csvImport').click()" class="p-2 hover:bg-slate-100 rounded-xl transition-colors text-slate-500" title="CSV Import">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </button>
                <input type="file" id="csvImport" class="hidden" accept=".csv" onchange="importCSV(this)">
                
                <select id="filterCategory" onchange="renderLibrary()" class="bg-white border border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:ring-2 ring-blue-500/20 shadow-sm cursor-pointer">
                    <option value="all">Alle Themen</option>
                </select>
                <input type="text" id="searchLibrary" oninput="renderLibrary()" placeholder="Suchen..." 
                    class="bg-white border border-slate-200 rounded-xl px-4 py-2 text-sm outline-none w-40 focus:w-64 transition-all shadow-sm">
                <button onclick="exportCSV()" class="p-2 hover:bg-slate-100 rounded-xl transition-colors text-slate-500" title="CSV Export">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <div class="max-w-3xl mx-auto mb-16">
            <div class="bg-white p-2 rounded-[2.5rem] shadow-2xl shadow-blue-900/10 flex items-center border-4 border-white">
                <input type="text" id="barcodeInput" autofocus 
                    class="flex-1 pl-8 pr-4 py-4 rounded-[2rem] text-xl font-medium outline-none placeholder-slate-300"
                    placeholder="Barcode oder Set-Nr. scannen...">
                <button onclick="fetchFromBrickset()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-[2rem] transition-all shadow-lg active:scale-95">
                    Hinzufügen
                </button>
            </div>
            <p id="apiStatus" class="text-center mt-4 text-[10px] font-black text-slate-400 uppercase tracking-widest italic leading-loose">Bereit zum Scannen</p>
        </div>

        <div id="library" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <script>
        const API_KEY = '3-N4Lr-Ug0H-M49ki';
        let mySets = JSON.parse(localStorage.getItem('bricksetCollection')) || [];
        let currentEditId = null;
        let currentStatus = "Used";

        const scanInput = document.getElementById('barcodeInput');
        const dbSearchInput = document.getElementById('searchLibrary');
        const catSelect = document.getElementById('filterCategory');

        let focusTimer;
        function resetFocusTimer() {
            clearTimeout(focusTimer);
            focusTimer = setTimeout(() => {
                if (document.activeElement !== dbSearchInput && document.activeElement !== catSelect && 
                    document.getElementById('detailModal').style.display !== 'flex') {
                    scanInput.focus();
                }
            }, 5000);
        }
        document.addEventListener('keydown', resetFocusTimer);
        document.addEventListener('mousedown', resetFocusTimer);
        
        scanInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchFromBrickset(); });

        async function fetchFromBrickset() {
            const query = scanInput.value.trim();
            if (!query) return;
            updateStatus("Verbindung wird hergestellt...", "text-blue-500 animate-pulse");
            const bricksetUrl = `https://brickset.com/api/v3.asmx/getSets?apiKey=${API_KEY}&userHash=&params={'query':'${query}'}`;
            const proxyUrls = [`https://api.allorigins.win/get?url=${encodeURIComponent(bricksetUrl)}`, `https://corsproxy.io/?${encodeURIComponent(bricksetUrl)}` ];

            let success = false;
            for (let url of proxyUrls) {
                if (success) break;
                try {
                    const response = await fetch(url);
                    const dataRaw = await response.json();
                    const data = dataRaw.contents ? JSON.parse(dataRaw.contents) : dataRaw;
                    if (data.status === "success" && data.matches > 0) {
                        addSet(data.sets[0]);
                        updateStatus("Set gefunden!", "text-green-600");
                        scanInput.value = '';
                        success = true;
                    } else if (data.status === "success" && data.matches === 0) {
                        updateStatus("Nummer unbekannt", "text-orange-500");
                        success = true;
                    }
                } catch (error) { console.error("Proxy fail"); }
            }
            if (!success) updateStatus("Verbindung fehlgeschlagen", "text-red-600");
        }

        function addSet(set) {
            if (mySets.some(s => s.setNumber === set.number)) return;
            let retailPrice = 0;
            if (set.LEGOCom && set.LEGOCom.DE && set.LEGOCom.DE.retailPrice) retailPrice = parseFloat(set.LEGOCom.DE.retailPrice);

            mySets.unshift({
                setNumber: set.number,
                name: set.name,
                year: set.year,
                pieces: set.pieces || 0,
                theme: set.theme,
                subtheme: set.subtheme || "",
                image: (set.image && set.image.imageURL) ? set.image.imageURL : 'https://via.placeholder.com/300x200?text=Lego+Set',
                price: retailPrice,
                status: "Used",
                addedAt: new Date().toLocaleDateString()
            });
            saveAndRender();
        }

        function openModal(id) {
            const set = mySets.find(s => s.setNumber === id);
            if(!set) return;
            currentEditId = id;
            document.getElementById('modalImg').src = set.image;
            document.getElementById('modalName').innerText = set.name;
            document.getElementById('modalTheme').innerText = set.theme;
            document.getElementById('modalId').innerText = "#" + set.setNumber;
            document.getElementById('modalDate').innerText = set.addedAt;
            document.getElementById('editPrice').value = set.price;
            document.getElementById('editSubtheme').value = set.subtheme || "";
            setStatus(set.status || "Used");
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function setStatus(s) {
            currentStatus = s;
            const bN = document.getElementById('btnNew');
            const bU = document.getElementById('btnUsed');
            if(s === 'New') {
                bN.className = "flex-1 py-3 rounded-xl border-2 font-bold bg-blue-600 border-blue-600 text-white shadow-lg";
                bU.className = "flex-1 py-3 rounded-xl border-2 font-bold bg-white border-slate-100 text-slate-400";
            } else {
                bU.className = "flex-1 py-3 rounded-xl border-2 font-bold bg-slate-800 border-slate-800 text-white shadow-lg";
                bN.className = "flex-1 py-3 rounded-xl border-2 font-bold bg-white border-slate-100 text-slate-400";
            }
        }

        function saveDetails() {
            const set = mySets.find(s => s.setNumber === currentEditId);
            if(set) {
                set.price = parseFloat(document.getElementById('editPrice').value) || 0;
                set.subtheme = document.getElementById('editSubtheme').value;
                set.status = currentStatus;
                saveAndRender();
                closeModal();
            }
        }

        // FIX: Importiert nun alle Felder inklusive BildURL, Zustand & Subtheme
        function importCSV(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n').slice(1);
                rows.forEach(row => {
                    const cols = row.split(';');
                    if(cols.length >= 9) {
                        const id = cols[0].replace("\uFEFF", "");
                        if(!mySets.some(s => s.setNumber === id)) {
                            mySets.push({
                                setNumber: id,
                                name: cols[1].replace(/"/g, ""),
                                theme: cols[2],
                                year: cols[3],
                                pieces: parseInt(cols[4]) || 0,
                                price: parseFloat(cols[5]) || 0,
                                subtheme: cols[6] || "",
                                status: cols[7] || "Used",
                                image: cols[8] || 'https://via.placeholder.com/300x200',
                                addedAt: cols[9] || new Date().toLocaleDateString()
                            });
                        }
                    }
                });
                saveAndRender();
            };
            reader.readAsText(file);
        }

        function deleteSet(num, event) {
            event.stopPropagation();
            if(confirm("Set löschen?")) {
                mySets = mySets.filter(s => s.setNumber !== num);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('bricksetCollection', JSON.stringify(mySets));
            updateStats();
            updateCategories();
            renderLibrary();
        }

        function updateStats() {
            const totalParts = mySets.reduce((sum, s) => sum + (s.pieces || 0), 0);
            const totalValue = mySets.reduce((sum, s) => sum + (s.price || 0), 0);
            document.getElementById('statSets').innerText = mySets.length;
            document.getElementById('statParts').innerText = totalParts.toLocaleString();
            document.getElementById('statValue').innerText = totalValue.toFixed(2) + " €";
        }

        function updateCategories() {
            const themes = [...new Set(mySets.map(s => s.theme))].sort();
            const current = catSelect.value;
            catSelect.innerHTML = '<option value="all">Alle Themen</option>' + themes.map(t => `<option value="${t}" ${t === current ? 'selected' : ''}>${t}</option>`).join('');
        }

        function renderLibrary() {
            const container = document.getElementById('library');
            const searchTerm = dbSearchInput.value.toLowerCase();
            const category = catSelect.value;
            const filtered = mySets.filter(s => (s.name.toLowerCase().includes(searchTerm) || s.setNumber.includes(searchTerm)) && (category === "all" || s.theme === category));

            container.innerHTML = filtered.map(set => `
                <div onclick="openModal('${set.setNumber}')" class="set-card bg-white rounded-[2rem] shadow-lg border border-slate-100 overflow-hidden relative animate-card">
                    <button onclick="deleteSet('${set.setNumber}', event)" class="delete-btn absolute top-4 right-4 bg-red-500 text-white p-2 rounded-xl hover:scale-110 shadow-lg z-10">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    <div class="h-48 bg-white flex items-center justify-center p-6 relative">
                        <img src="${set.image}" class="max-h-full max-w-full object-contain drop-shadow-xl">
                        <div class="absolute bottom-2 left-4 flex gap-1">
                             <span class="text-[8px] font-bold px-2 py-0.5 rounded-full ${set.status === 'New' ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-600'}">${set.status || 'Used'}</span>
                             ${set.subtheme ? `<span class="text-[8px] font-bold px-2 py-0.5 rounded-full bg-slate-50 text-slate-400 truncate max-w-[80px]">${set.subtheme}</span>` : ''}
                        </div>
                    </div>
                    <div class="p-6 pt-2">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase tracking-widest">${set.theme}</span>
                            <div class="text-slate-300">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </div>
                        </div>
                        <h3 class="font-bold text-slate-800 leading-tight mb-4 h-10 overflow-hidden text-sm">${set.name}</h3>
                        <div class="flex justify-between items-end border-t border-slate-50 pt-4">
                            <div class="text-[10px] text-slate-400 font-bold uppercase leading-tight">
                                <p class="text-slate-700">#${set.setNumber}</p>
                                <p>${set.pieces} TEILE</p>
                            </div>
                            <div class="text-right">
                                <p class="text-lg font-extrabold text-slate-900">${set.price > 0 ? set.price.toFixed(2) + " €" : "0.00 €"}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStatus(msg, colorClass) {
            const el = document.getElementById('apiStatus');
            el.innerText = msg;
            el.className = `text-center mt-4 text-[10px] font-black uppercase tracking-widest italic ${colorClass}`;
        }

        // FIX: Exportiert nun alle Felder für einen perfekten Re-Import
        function exportCSV() {
            if(mySets.length === 0) return alert("Liste leer.");
            let csv = "\uFEFFSet-Nr;Name;Thema;Jahr;Teile;Preis;Subtheme;Zustand;BildURL;Datum\n";
            mySets.forEach(s => {
                csv += `${s.setNumber};"${s.name}";${s.theme};${s.year};${s.pieces};${s.price};${s.subtheme || ""};${s.status || "Used"};${s.image};${s.addedAt}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `LEGO_Sammlung_Backup.csv`;
            link.click();
        }

        updateStats();
        updateCategories();
        renderLibrary();
    </script>
</body>
</html>
