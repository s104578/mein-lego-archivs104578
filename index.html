<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brix Just4Sean - Ultimate Collection Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        
        .set-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .set-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        
        /* Checkbox-Animation */
        .select-checkbox { opacity: 0; transform: scale(0.8); transition: all 0.2s; }
        .set-card:hover .select-checkbox, .select-checkbox:checked { opacity: 1; transform: scale(1); }

        #detailModal { display: none; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); }
        
        /* Subtheme Styling */
        .subtheme-starwars { background: #000; color: #ffe81f; border: 1px solid #334155; }
        .subtheme-ucs { background: linear-gradient(90deg, #bf953f, #fcf6ba, #bf953f); color: #000; font-weight: 800; }
        .subtheme-default { background: #f1f5f9; color: #64748b; }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div id="actionBar" class="fixed top-0 left-0 right-0 z-[60] bg-slate-900 text-white py-4 px-6 shadow-2xl hidden transform translate-y-0 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span id="selectedCount" class="bg-blue-500 text-white px-3 py-1 rounded-full font-black text-sm">0</span>
                <p class="font-bold text-sm">Sets ausgewählt</p>
            </div>
            <div class="flex gap-3">
                <select id="bulkStatus" class="bg-slate-800 text-xs border-none rounded-lg px-3 py-2 outline-none">
                    <option value="">Status ändern...</option>
                    <option value="New">Neu (MISB)</option>
                    <option value="Used">Gebraucht</option>
                </select>
                <button onclick="applyBulkStatus()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-xs font-bold transition-all">Anwenden</button>
                <div class="w-[1px] bg-slate-700 mx-2"></div>
                <button onclick="deleteSelected()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-4 py-2 rounded-lg text-xs font-bold transition-all">Löschen</button>
                <button onclick="clearSelection()" class="text-slate-400 hover:text-white px-2 text-xs font-bold">X</button>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tighter">BRIX <span class="text-blue-600">JUST4SEAN</span></h1>
            
            <div class="flex gap-8 bg-white/50 p-2 px-6 rounded-2xl border border-slate-100">
                <div class="text-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Gesamtwert</p>
                    <p id="statValue" class="text-xl font-black text-blue-600">0.00 €</p>
                </div>
                <div class="text-center border-l border-slate-200 pl-8">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Sets / Teile</p>
                    <p class="text-sm font-bold text-slate-700"><span id="statSets">0</span> / <span id="statParts">0</span></p>
                </div>
            </div>

            <div class="flex gap-2">
                <select id="filterTheme" onchange="renderLibrary()" class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold outline-none">
                    <option value="all">Alle Themen</option>
                </select>
                <input type="text" id="searchLibrary" oninput="renderLibrary()" placeholder="Suchen..." class="bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none w-32 focus:w-48 transition-all">
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-10">
        <div class="max-w-2xl mx-auto mb-16">
            <div class="bg-white p-2 rounded-[2rem] shadow-xl flex items-center border border-slate-200 focus-within:border-blue-400 transition-all">
                <input type="text" id="barcodeInput" class="flex-1 pl-6 pr-4 py-3 rounded-2xl outline-none text-lg" placeholder="Set-Nummer eingeben..." onkeydown="if(event.key === 'Enter') fetchSets()">
                <button onclick="fetchSets()" class="bg-blue-600 text-white font-bold py-3 px-8 rounded-[1.5rem] hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">Hinzufügen</button>
            </div>
            <div id="apiStatus" class="mt-4 text-center text-[11px] font-bold text-slate-400 uppercase tracking-widest italic">Bereit</div>
        </div>

        <div id="library" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <div id="detailModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl rounded-[2.5rem] shadow-2xl overflow-hidden relative flex flex-col md:flex-row">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-300 hover:text-slate-600 z-10"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            
            <div class="md:w-1/2 bg-slate-50 p-10 flex flex-col items-center justify-center border-r border-slate-100">
                <img id="modalImg" src="" class="max-h-64 object-contain drop-shadow-2xl">
            </div>

            <div class="md:w-1/2 p-10">
                <p id="modalTheme" class="text-xs font-black text-blue-600 uppercase mb-1"></p>
                <h2 id="modalName" class="text-2xl font-black text-slate-800 mb-6 leading-tight"></h2>
                
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <label class="text-[10px] font-black text-slate-400 uppercase">UVP Preis (€)</label>
                            <input type="number" id="editRetailPrice" step="0.01" class="w-full bg-transparent border-none font-bold text-slate-800 outline-none">
                        </div>
                        <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                            <label class="text-[10px] font-black text-blue-500 uppercase">Marktwert (€)</label>
                            <input type="number" id="editCurrentValue" step="0.01" class="w-full bg-transparent border-none font-bold text-blue-600 outline-none">
                        </div>
                    </div>
                    
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase">Zustand</p>
                        <div class="flex gap-2 mt-2">
                            <button onclick="setEditStatus('New')" id="btnNew" class="flex-1 py-3 rounded-xl border-2 font-bold text-sm transition-all">New</button>
                            <button onclick="setEditStatus('Used')" id="btnUsed" class="flex-1 py-3 rounded-xl border-2 font-bold text-sm transition-all">Used</button>
                        </div>
                    </div>

                    <button onclick="saveDetails()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold mt-4 hover:bg-blue-600 transition-all shadow-lg">Speichern</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY_BRICKSET = '3-N4Lr-Ug0H-M49ki';
        const API_KEY_REBRICKABLE = '74d1510666ec62fef948d197af293799';
        
        let mySets = JSON.parse(localStorage.getItem('bricksetCollection')) || [];
        let selectedSets = new Set();
        let currentEditId = null;
        let tempStatus = "Used";

        // AGRESSIVES SCRAPING FÜR UVP (BrickEconomy)
        async function scrapeUVP(setNum) {
            console.log(`🔎 Scrape UVP für ${setNum}...`);
            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent('https://www.brickeconomy.com/set/' + setNum + '-1/')}`;
                const response = await fetch(proxyUrl);
                const html = await response.text();
                
                // Sucht nach "Retail price" gefolgt von Währungssymbol und Zahl
                const regex = /Retail price.*?([€$£]\s?(\d+[\.,]\d{2}))/i;
                const match = html.match(regex);
                
                if (match && match[2]) {
                    const price = parseFloat(match[2].replace(',', '.'));
                    console.log("✅ Treffer BrickEconomy:", price);
                    return price;
                }
            } catch (e) { console.error("Scraping Error", e); }
            return 0;
        }

        async function fetchSets() {
            const input = document.getElementById('barcodeInput');
            const query = input.value.trim();
            if (!query) return;
            
            setStatus("Suche bei Brickset...", "text-blue-500 animate-pulse");
            let setObj = null;

            try {
                // 1. Brickset API
                const params = JSON.stringify({ query: query, pageSize: 1, extendedData: 1 });
                const url = `https://corsproxy.io/?${encodeURIComponent('https://brickset.com/api/v3.asmx/getSets?apiKey=' + API_KEY_BRICKSET + '&userHash=&params=' + params)}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.status === "success" && data.matches > 0) {
                    const s = data.sets[0];
                    // Aggressives Preis-Lookup in verschiedenen Feldern
                    let p = s.retailPrice || s.LEGOCom?.DE?.retailPrice || s.LEGOCom?.UK?.retailPrice || 0;

                    setObj = {
                        setNumber: String(s.number),
                        name: s.name,
                        pieces: s.pieces || 0,
                        theme: s.theme,
                        subtheme: s.subtheme || "",
                        image: s.image?.imageURL || '',
                        price: parseFloat(p) || 0,
                        currentValue: 0,
                        status: "Used"
                    };
                } else {
                    // 2. Rebrickable Fallback
                    setStatus("Brickset negativ. Frage Rebrickable...", "text-orange-500");
                    const rbRes = await fetch(`https://rebrickable.com/api/v3/lego/sets/${query}-1/`, {
                        headers: { 'Authorization': `key ${API_KEY_REBRICKABLE}` }
                    });
                    if (rbRes.ok) {
                        const rb = await rbRes.json();
                        setObj = {
                            setNumber: query,
                            name: rb.name,
                            pieces: rb.num_parts,
                            theme: "LEGO",
                            subtheme: "",
                            image: rb.set_img_url,
                            price: 0,
                            currentValue: 0,
                            status: "Used"
                        };
                    }
                }

                // 3. BrickEconomy Fallback für den Preis
                if (setObj && setObj.price === 0) {
                    setStatus("UVP fehlt. Suche bei BrickEconomy...", "text-purple-600 animate-pulse");
                    const bePrice = await scrapeUVP(setObj.setNumber);
                    if (bePrice > 0) setObj.price = bePrice;
                }

            } catch (e) {
                setStatus("API Fehler!", "text-red-500");
            }

            if (setObj) {
                if(mySets.find(x => x.setNumber === setObj.setNumber)) {
                    setStatus("Set existiert bereits!", "text-orange-600");
                } else {
                    mySets.unshift(setObj);
                    saveAndRender();
                    input.value = '';
                    setStatus("Erfolgreich hinzugefügt!", "text-green-600");
                }
            } else {
                setStatus("Set nicht gefunden.", "text-red-500");
            }
        }

        function renderLibrary() {
            const term = document.getElementById('searchLibrary').value.toLowerCase();
            const themeFilter = document.getElementById('filterTheme').value;
            const lib = document.getElementById('library');
            
            const filtered = mySets.filter(s => 
                (s.name.toLowerCase().includes(term) || s.setNumber.includes(term)) && 
                (themeFilter === "all" || s.theme === themeFilter)
            );

            lib.innerHTML = filtered.map(s => `
                <div class="set-card bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden relative group">
                    <input type="checkbox" ${selectedSets.has(s.setNumber) ? 'checked' : ''} onchange="toggleSelection('${s.setNumber}')" class="select-checkbox absolute top-5 left-5 z-20 w-5 h-5 accent-blue-600 cursor-pointer">
                    
                    <div onclick="openModal('${s.setNumber}')" class="cursor-pointer">
                        <div class="h-44 bg-slate-50 flex items-center justify-center p-6 relative">
                            <img src="${s.image}" class="max-h-full drop-shadow-xl group-hover:scale-105 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                            <span class="absolute bottom-3 right-4 text-[9px] font-black px-2 py-1 rounded-lg ${s.status === 'New' ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-600'}">${s.status}</span>
                        </div>
                        <div class="p-6">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-[9px] font-black text-blue-500 bg-blue-50 px-2 py-0.5 rounded uppercase">${s.theme}</span>
                                ${s.subtheme ? `<span class="text-[9px] font-bold text-slate-400">/ ${s.subtheme}</span>` : ''}
                            </div>
                            <h3 class="font-bold text-slate-800 text-sm h-10 overflow-hidden line-clamp-2 mb-4">${s.name}</h3>
                            <div class="flex justify-between items-end border-t border-slate-50 pt-4">
                                <div>
                                    <p class="text-[10px] text-slate-300 font-bold uppercase tracking-widest">Set #${s.setNumber}</p>
                                    <p class="text-xs font-bold text-slate-600">${s.price > 0 ? s.price.toFixed(2) + ' €' : '<span class="text-red-400">UVP ?</span>'}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[9px] font-black text-slate-300 uppercase leading-none mb-1">Wert</p>
                                    <p class="text-xl font-black text-blue-600 leading-none">${s.currentValue.toFixed(2)} €</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            updateStats();
        }

        function setStatus(m, c) { const el = document.getElementById('apiStatus'); el.innerText = m; el.className = `mt-4 text-center text-[11px] font-bold uppercase tracking-widest italic ${c}`; }

        function openModal(id) {
            currentEditId = id;
            const s = mySets.find(x => x.setNumber === id);
            document.getElementById('modalImg').src = s.image;
            document.getElementById('modalName').innerText = s.name;
            document.getElementById('modalTheme').innerText = s.theme;
            document.getElementById('editRetailPrice').value = s.price;
            document.getElementById('editCurrentValue').value = s.currentValue;
            setEditStatus(s.status || "Used");
            document.getElementById('detailModal').style.display = 'flex';
        }

        function setEditStatus(st) {
            tempStatus = st;
            const bN = document.getElementById('btnNew');
            const bU = document.getElementById('btnUsed');
            if(st === 'New') {
                bN.className = "flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-blue-600 text-white border-blue-600";
                bU.className = "flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white text-slate-300 border-slate-100";
            } else {
                bU.className = "flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-slate-800 text-white border-slate-800";
                bN.className = "flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white text-slate-300 border-slate-100";
            }
        }

        function saveDetails() {
            const s = mySets.find(x => x.setNumber === currentEditId);
            s.price = parseFloat(document.getElementById('editRetailPrice').value) || 0;
            s.currentValue = parseFloat(document.getElementById('editCurrentValue').value) || 0;
            s.status = tempStatus;
            saveAndRender(); closeModal();
        }

        function toggleSelection(id) {
            if (selectedSets.has(id)) selectedSets.delete(id);
            else selectedSets.add(id);
            document.getElementById('selectedCount').innerText = selectedSets.size;
            document.getElementById('actionBar').classList.toggle('hidden', selectedSets.size === 0);
        }

        function applyBulkStatus() {
            const newSt = document.getElementById('bulkStatus').value;
            if(!newSt) return;
            mySets.forEach(s => { if(selectedSets.has(s.setNumber)) s.status = newSt; });
            clearSelection(); saveAndRender();
        }

        function deleteSelected() {
            if(!confirm("Ausgewählte Sets wirklich löschen?")) return;
            mySets = mySets.filter(s => !selectedSets.has(s.setNumber));
            clearSelection(); saveAndRender();
        }

        function clearSelection() { selectedSets.clear(); document.getElementById('actionBar').classList.add('hidden'); renderLibrary(); }
        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
        
        function updateStats() {
            const val = mySets.reduce((a, b) => a + b.currentValue, 0);
            const pts = mySets.reduce((a, b) => a + (parseInt(b.pieces) || 0), 0);
            document.getElementById('statValue').innerText = val.toFixed(2) + " €";
            document.getElementById('statSets').innerText = mySets.length;
            document.getElementById('statParts').innerText = pts.toLocaleString();
            
            const themes = [...new Set(mySets.map(s => s.theme))].sort();
            const filter = document.getElementById('filterTheme');
            const current = filter.value;
            filter.innerHTML = '<option value="all">Alle Themen</option>' + themes.map(t => `<option value="${t}" ${t===current?'selected':''}>${t}</option>`).join('');
        }

        function saveAndRender() { localStorage.setItem('bricksetCollection', JSON.stringify(mySets)); renderLibrary(); }

        renderLibrary();
    </script>
</body>
</html>
