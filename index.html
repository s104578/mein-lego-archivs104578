<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brickset Collector Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); }
        .set-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .set-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); }
        .delete-btn { opacity: 0; transition: all 0.2s; }
        .set-card:hover .delete-btn { opacity: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-card { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <nav class="sticky top-0 z-50 glass mb-8 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg shadow-lg shadow-blue-200">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">BRICKSET<span class="text-blue-600">CLOUD</span></h1>
            </div>

            <div class="flex gap-6 text-center">
                <div><p class="text-[10px] uppercase font-black text-slate-400">Sets</p><p id="statSets" class="font-bold text-slate-800">0</p></div>
                <div><p class="text-[10px] uppercase font-black text-slate-400">Teile</p><p id="statParts" class="font-bold text-slate-800">0</p></div>
                <div><p class="text-[10px] uppercase font-black text-slate-400">Gesamtwert</p><p id="statValue" class="font-bold text-blue-600">0.00 €</p></div>
            </div>

            <div class="flex gap-2">
                <select id="filterCategory" onchange="renderLibrary()" class="bg-white border border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:ring-2 ring-blue-500/20 shadow-sm cursor-pointer">
                    <option value="all">Alle Themen</option>
                </select>
                <input type="text" id="searchLibrary" oninput="renderLibrary()" placeholder="Suchen..." 
                    class="bg-white border border-slate-200 rounded-xl px-4 py-2 text-sm outline-none w-40 focus:w-64 transition-all shadow-sm">
                <button onclick="exportCSV()" class="p-2 hover:bg-slate-100 rounded-xl transition-colors text-slate-500" title="CSV Export">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <div class="max-w-3xl mx-auto mb-16">
            <div class="bg-white p-2 rounded-[2.5rem] shadow-2xl shadow-blue-900/10 flex items-center border-4 border-white">
                <input type="text" id="barcodeInput" autofocus 
                    class="flex-1 pl-8 pr-4 py-4 rounded-[2rem] text-xl font-medium outline-none placeholder-slate-300"
                    placeholder="Barcode scannen...">
                <button onclick="fetchFromBrickset()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-[2rem] transition-all shadow-lg active:scale-95">
                    Hinzufügen
                </button>
            </div>
            <p id="apiStatus" class="text-center mt-4 text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Bereit zum Scannen</p>
        </div>

        <div id="library" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </main>

    <script>
        const API_KEY = '3-N4Lr-Ug0H-M49ki';
        const PROXY_URL = "https://api.allorigins.win/get?url=";
        
        let mySets = JSON.parse(localStorage.getItem('bricksetCollection')) || [];

        const scanInput = document.getElementById('barcodeInput');
        const dbSearchInput = document.getElementById('searchLibrary');
        const catSelect = document.getElementById('filterCategory');

        // Intelligenter Fokus
        let focusTimer;
        function resetFocusTimer() {
            clearTimeout(focusTimer);
            focusTimer = setTimeout(() => {
                if (document.activeElement !== dbSearchInput && document.activeElement !== catSelect) {
                    scanInput.focus();
                }
            }, 5000);
        }
        document.addEventListener('keydown', resetFocusTimer);
        document.addEventListener('mousedown', resetFocusTimer);
        
        scanInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchFromBrickset(); });

        async function fetchFromBrickset() {
            const query = scanInput.value.trim();
            if (!query) return;

            updateStatus("Verbindung zur API wird hergestellt...", "text-blue-500 animate-pulse");
            const bricksetUrl = `https://brickset.com/api/v3.asmx/getSets?apiKey=${API_KEY}&userHash=&params={'query':'${query}'}`;
            
            try {
                // Fetch über Proxy
                const response = await fetch(PROXY_URL + encodeURIComponent(bricksetUrl));
                if (!response.ok) throw new Error("Proxy-Server-Fehler");
                
                const dataRaw = await response.json();
                
                // Falls AllOrigins nichts liefert
                if (!dataRaw.contents) throw new Error("Keine Daten vom Proxy erhalten");

                const data = JSON.parse(dataRaw.contents);

                if (data.status === "success" && data.matches > 0) {
                    addSet(data.sets[0]);
                    updateStatus("Set gefunden und hinzugefügt!", "text-green-600");
                    scanInput.value = '';
                } else if (data.status === "error") {
                    updateStatus("Brickset-Fehler: " + data.message, "text-red-500");
                } else {
                    updateStatus("Set-Nummer nicht im Katalog", "text-orange-500");
                }
            } catch (error) {
                console.error("Fehlerbericht:", error);
                updateStatus("API-Verbindung fehlgeschlagen (Proxy)", "text-red-600");
            }
        }

        function addSet(set) {
            if (mySets.some(s => s.setNumber === set.number)) {
                updateStatus("Set ist bereits in deiner Liste", "text-orange-500");
                return;
            }

            mySets.unshift({
                setNumber: set.number,
                name: set.name,
                year: set.year,
                pieces: set.pieces || 0,
                theme: set.theme,
                image: (set.image && set.image.imageURL) ? set.image.imageURL : 'https://via.placeholder.com/300x200?text=Bild+fehlt',
                price: (set.LEGOCom && set.LEGOCom.DE) ? parseFloat(set.LEGOCom.DE.retailPrice) : 0,
                addedAt: new Date().toLocaleDateString()
            });

            saveAndRender();
        }

        function deleteSet(num) {
            if(confirm("Dieses Set wirklich löschen?")) {
                mySets = mySets.filter(s => s.setNumber !== num);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('bricksetCollection', JSON.stringify(mySets));
            updateStats();
            updateCategories();
            renderLibrary();
        }

        function updateStats() {
            const totalParts = mySets.reduce((sum, s) => sum + s.pieces, 0);
            const totalValue = mySets.reduce((sum, s) => sum + s.price, 0);
            document.getElementById('statSets').innerText = mySets.length;
            document.getElementById('statParts').innerText = totalParts.toLocaleString();
            document.getElementById('statValue').innerText = totalValue.toFixed(2) + " €";
        }

        function updateCategories() {
            const themes = [...new Set(mySets.map(s => s.theme))].sort();
            const current = catSelect.value;
            catSelect.innerHTML = '<option value="all">Alle Themen</option>' + 
                themes.map(t => `<option value="${t}" ${t === current ? 'selected' : ''}>${t}</option>`).join('');
        }

        function renderLibrary() {
            const container = document.getElementById('library');
            const searchTerm = dbSearchInput.value.toLowerCase();
            const category = catSelect.value;

            const filtered = mySets.filter(s => {
                const matchesSearch = s.name.toLowerCase().includes(searchTerm) || s.setNumber.includes(searchTerm);
                const matchesCat = category === "all" || s.theme === category;
                return matchesSearch && matchesCat;
            });

            container.innerHTML = filtered.map(set => `
                <div class="set-card bg-white rounded-[2rem] shadow-lg border border-slate-100 overflow-hidden relative animate-card">
                    <button onclick="deleteSet('${set.setNumber}')" class="delete-btn absolute top-4 right-4 bg-red-500 text-white p-2 rounded-xl hover:scale-110 shadow-lg z-10">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    <div class="h-48 bg-white flex items-center justify-center p-6">
                        <img src="${set.image}" alt="${set.name}" class="max-h-full max-w-full object-contain drop-shadow-xl" loading="lazy">
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase tracking-widest">${set.theme}</span>
                            <span class="text-[9px] font-bold text-slate-400">${set.year}</span>
                        </div>
                        <h3 class="font-bold text-slate-800 leading-tight mb-4 h-10 overflow-hidden text-sm">${set.name}</h3>
                        <div class="flex justify-between items-end border-t border-slate-50 pt-4">
                            <div class="text-[10px] text-slate-400 font-bold uppercase leading-tight">
                                <p class="text-slate-700">#${set.setNumber}</p>
                                <p>${set.pieces} TEILE</p>
                            </div>
                            <div class="text-right">
                                <p class="text-lg font-extrabold text-slate-900">${set.price > 0 ? set.price.toFixed(2) + " €" : "---"}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStatus(msg, colorClass) {
            const el = document.getElementById('apiStatus');
            el.innerText = msg;
            el.className = `text-center mt-4 text-[10px] font-black uppercase tracking-widest italic ${colorClass}`;
        }

        function exportCSV() {
            if(mySets.length === 0) return alert("Die Liste ist leer.");
            let csv = "\uFEFFSet-Nr;Name;Thema;Jahr;Teile;Preis\n";
            mySets.forEach(s => csv += `${s.setNumber};"${s.name}";${s.theme};${s.year};${s.pieces};${s.price}\n`);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `LEGO_Sammlung_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        // Initialisierung
        updateStats();
        updateCategories();
        renderLibrary();
    </script>
</body>
</html>
