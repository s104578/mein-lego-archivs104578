<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brickset Inventory Manager 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .set-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative; }
        .set-card:hover { transform: translateY(-4px); shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        #detailModal { display: none; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); }
        .selection-active .batch-actions { display: flex; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        input[type="checkbox"] { width: 1.5rem; height: 1.5rem; border-radius: 0.5rem; cursor: pointer; }
    </style>
</head>
<body class="min-h-screen pb-32">

    <div id="detailModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 z-10">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="md:w-1/2 bg-slate-50 p-8 flex flex-col items-center justify-center border-r">
                <img id="modalImg" src="" class="max-h-64 object-contain drop-shadow-2xl mb-6">
                <div class="w-full text-center md:text-left">
                    <p class="text-xs font-black text-blue-600 uppercase tracking-widest" id="modalTheme"></p>
                    <h2 class="text-2xl font-extrabold text-slate-800" id="modalName"></h2>
                    <p class="text-slate-400 font-bold" id="modalId"></p>
                </div>
            </div>

            <div class="md:w-1/2 p-10 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <p class="text-[10px] font-black text-slate-400 uppercase">UVP (RRP) in €</p>
                        <input type="number" id="editRRP" step="0.01" class="bg-transparent font-bold text-slate-800 w-full outline-none text-lg">
                    </div>
                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                        <p class="text-[10px] font-black text-blue-500 uppercase">Current Value (Marktwert)</p>
                        <input type="number" id="editCurrentValue" step="0.01" class="bg-transparent font-bold text-blue-700 w-full outline-none text-lg">
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Sub Theme</p>
                    <input type="text" id="editSubtheme" class="bg-transparent font-bold text-slate-800 w-full outline-none" placeholder="z.B. Ultimate Collector Series">
                </div>

                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Zustand</p>
                    <div class="flex gap-3">
                        <button onclick="setStatus('New')" id="btnNew" class="flex-1 py-3 rounded-xl border-2 font-bold transition-all">New</button>
                        <button onclick="setStatus('Used')" id="btnUsed" class="flex-1 py-3 rounded-xl border-2 font-bold transition-all">Used</button>
                    </div>
                </div>

                <button onclick="saveDetails()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-200 transition-all active:scale-95 mt-4">
                    Änderungen speichern
                </button>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <h1 class="text-2xl font-extrabold tracking-tighter text-blue-600">BRICKSET<span class="text-slate-800">DB</span></h1>
                <span class="text-[10px] font-bold bg-slate-100 px-2 py-0.5 rounded text-slate-500">2026</span>
            </div>

            <div class="flex items-center gap-8">
                <div class="text-center">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Sammlungswert</p>
                    <p id="totalValue" class="text-xl font-extrabold text-blue-600">0.00 €</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('csvImport').click()" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                    <input type="file" id="csvImport" class="hidden" accept=".csv" onchange="importCSV(this)">
                    <button onclick="exportCSV()" class="p-2 bg-slate-100 rounded-lg hover:bg-slate-200 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-10">
        <div class="max-w-3xl mx-auto mb-16 space-y-4">
            <div class="bg-white p-2 rounded-full shadow-2xl flex border-4 border-white">
                <input type="text" id="barcodeInput" class="flex-1 pl-8 outline-none text-lg font-medium" placeholder="Barcode oder Set-Nummer scannen...">
                <button onclick="fetchFromBrickset()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-full font-bold shadow-lg transition-all active:scale-95">
                    Hinzufügen
                </button>
            </div>
            <p id="apiStatus" class="text-center text-[10px] font-black uppercase text-slate-400 tracking-widest italic">Bereit zum Scannen</p>
        </div>

        <div id="library" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <div id="batchBar" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50 hidden batch-actions bg-slate-900 text-white px-8 py-4 rounded-3xl shadow-2xl flex items-center gap-8 border border-slate-700">
        <div class="flex flex-col">
            <span id="batchCount" class="font-bold text-blue-400 leading-none text-lg">0</span>
            <span class="text-[10px] uppercase font-black text-slate-400">Sets gewählt</span>
        </div>
        <div class="h-8 w-px bg-slate-700"></div>
        <div class="flex gap-4">
            <button onclick="bulkEdit()" class="px-4 py-2 hover:bg-slate-800 rounded-xl text-sm font-bold transition-colors">Zustand/Subtheme ändern</button>
            <button onclick="bulkDelete()" class="px-4 py-2 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white rounded-xl text-sm font-bold transition-all">Markierte Löschen</button>
        </div>
        <button onclick="clearSelection()" class="text-slate-400 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <script>
        const API_KEY = '3-N4Lr-Ug0H-M49ki';
        let mySets = JSON.parse(localStorage.getItem('bricksetCollection')) || [];
        let selectedSets = new Set();
        let currentEditId = null;
        let currentStatus = "Used";

        // API Fetching mit Währungs-Check
        async function fetchFromBrickset() {
            const query = document.getElementById('barcodeInput').value.trim();
            if (!query) return;
            updateStatus("Verbinde mit Brickset...", "text-blue-500");
            
            const url = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://brickset.com/api/v3.asmx/getSets?apiKey=${API_KEY}&userHash=&params={'query':'${query}'}`)}`;
            
            try {
                const response = await fetch(url);
                const raw = await response.json();
                const data = JSON.parse(raw.contents);
                if (data.status === "success" && data.matches > 0) {
                    addSet(data.sets[0]);
                    document.getElementById('barcodeInput').value = '';
                    updateStatus("Set erfolgreich hinzugefügt", "text-green-600");
                } else {
                    updateStatus("Set nicht gefunden", "text-orange-500");
                }
            } catch (e) { updateStatus("CORS/API Fehler", "text-red-600"); }
        }

        function addSet(set) {
            if (mySets.some(s => s.setNumber === set.number)) return;
            
            // Währungs-Logik: DE Preis bevorzugen, sonst US-Dollar als Euro nutzen
            let rrp = 0;
            if (set.LEGOCom && set.LEGOCom.DE) rrp = parseFloat(set.LEGOCom.DE.retailPrice);
            else if (set.LEGOCom && set.LEGOCom.US) rrp = parseFloat(set.LEGOCom.US.retailPrice);

            mySets.unshift({
                setNumber: set.number,
                name: set.name,
                theme: set.theme,
                subtheme: set.subtheme || "",
                pieces: set.pieces || 0,
                year: set.year,
                image: set.image?.imageURL || 'https://via.placeholder.com/300x200?text=Kein+Bild',
                price: rrp || 0,
                currentValue: rrp || 0, // Initial Marktwert = UVP
                status: "Used",
                addedAt: new Date().toLocaleDateString()
            });
            saveAndRender();
        }

        // Selection Logik
        function toggleSelect(id, event) {
            event.stopPropagation();
            if (selectedSets.has(id)) selectedSets.delete(id);
            else selectedSets.add(id);
            updateBatchBar();
            renderLibrary();
        }

        function updateBatchBar() {
            const bar = document.getElementById('batchBar');
            if (selectedSets.size > 0) {
                bar.classList.remove('hidden');
                bar.classList.add('flex');
                document.getElementById('batchCount').innerText = selectedSets.size;
            } else {
                bar.classList.add('hidden');
            }
        }

        function clearSelection() {
            selectedSets.clear();
            updateBatchBar();
            renderLibrary();
        }

        // Massen-Operationen
        function bulkDelete() {
            if (confirm(`${selectedSets.size} Sets aus der Sammlung entfernen?`)) {
                mySets = mySets.filter(s => !selectedSets.has(s.setNumber));
                clearSelection();
                saveAndRender();
            }
        }

        function bulkEdit() {
            const newSub = prompt("Neues Sub Theme für markierte Sets eingeben (Leerlassen für keine Änderung):");
            const newStatus = confirm("Zustand auf 'NEW' setzen? (Abbrechen für 'USED')") ? "New" : "Used";
            
            mySets.forEach(s => {
                if (selectedSets.has(s.setNumber)) {
                    if (newSub !== null && newSub !== "") s.subtheme = newSub;
                    s.status = newStatus;
                }
            });
            clearSelection();
            saveAndRender();
        }

        // Modal Funktionen
        function openModal(id) {
            if (selectedSets.size > 0) return; 
            const set = mySets.find(s => s.setNumber === id);
            currentEditId = id;
            document.getElementById('modalImg').src = set.image;
            document.getElementById('modalName').innerText = set.name;
            document.getElementById('modalTheme').innerText = set.theme;
            document.getElementById('modalId').innerText = "#" + set.setNumber;
            document.getElementById('editRRP').value = set.price;
            document.getElementById('editCurrentValue').value = set.currentValue;
            document.getElementById('editSubtheme').value = set.subtheme;
            setStatus(set.status);
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

        function setStatus(s) {
            currentStatus = s;
            const bN = document.getElementById('btnNew');
            const bU = document.getElementById('btnUsed');
            bN.className = s === 'New' ? "flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold shadow-lg" : "flex-1 py-3 rounded-xl border-2 font-bold text-slate-400";
            bU.className = s === 'Used' ? "flex-1 py-3 rounded-xl bg-slate-800 text-white font-bold shadow-lg" : "flex-1 py-3 rounded-xl border-2 font-bold text-slate-400";
        }

        function saveDetails() {
            const set = mySets.find(s => s.setNumber === currentEditId);
            set.price = parseFloat(document.getElementById('editRRP').value) || 0;
            set.currentValue = parseFloat(document.getElementById('editCurrentValue').value) || 0;
            set.subtheme = document.getElementById('editSubtheme').value;
            set.status = currentStatus;
            saveAndRender();
            closeModal();
        }

        // Kern-Funktionen
        function renderLibrary() {
            const container = document.getElementById('library');
            container.innerHTML = mySets.map(set => {
                const isSelected = selectedSets.has(set.setNumber);
                return `
                <div onclick="openModal('${set.setNumber}')" class="set-card bg-white rounded-[2.5rem] p-6 shadow-sm border-2 ${isSelected ? 'border-blue-500 bg-blue-50/30 ring-4 ring-blue-50' : 'border-white'}">
                    <input type="checkbox" onclick="toggleSelect('${set.setNumber}', event)" ${isSelected ? 'checked' : ''} class="absolute top-6 right-6 z-20 accent-blue-600">
                    <div class="h-44 flex items-center justify-center mb-6 relative">
                        <img src="${set.image}" class="max-h-full drop-shadow-2xl">
                        <div class="absolute bottom-0 left-0 flex gap-2">
                             <span class="text-[8px] font-black px-2 py-0.5 rounded-full ${set.status === 'New' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-white'}">${set.status}</span>
                             ${set.subtheme ? `<span class="text-[8px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 truncate max-w-[100px]">${set.subtheme}</span>` : ''}
                        </div>
                    </div>
                    <span class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase tracking-widest">${set.theme}</span>
                    <h3 class="font-extrabold text-slate-800 text-sm mt-2 h-10 overflow-hidden leading-tight">${set.name}</h3>
                    
                    <div class="flex justify-between items-end mt-4 pt-4 border-t border-slate-50 gap-2">
                        <div class="text-[10px] text-slate-400 font-bold uppercase leading-tight">
                            <p class="text-slate-800">#${set.setNumber}</p>
                            <p>${set.pieces} Teile</p>
                            <p class="mt-1">UVP: ${set.price.toFixed(2)} €</p>
                        </div>
                        <div class="text-right">
                             <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Marktwert</p>
                             <p class="text-xl font-black text-blue-600 leading-none">${set.currentValue.toFixed(2)} €</p>
                        </div>
                    </div>
                </div>
            `}).join('');
            updateStats();
        }

        function updateStats() {
            const total = mySets.reduce((sum, s) => sum + (s.currentValue || 0), 0);
            document.getElementById('totalValue').innerText = total.toFixed(2) + " €";
        }

        function updateStatus(msg, color) {
            const el = document.getElementById('apiStatus');
            el.innerText = msg;
            el.className = `text-center text-[10px] font-black uppercase tracking-widest italic ${color}`;
        }

        function saveAndRender() {
            localStorage.setItem('bricksetCollection', JSON.stringify(mySets));
            renderLibrary();
        }

        // CSV Export/Import Logik
        function exportCSV() {
            if(mySets.length === 0) return;
            let csv = "\uFEFFNr;Name;Thema;Subtheme;UVP;Marktwert;Zustand;Bild\n";
            mySets.forEach(s => {
                csv += `${s.setNumber};"${s.name}";${s.theme};"${s.subtheme}";${s.price};${s.currentValue};${s.status};${s.image}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Lego_Sammlung_Backup.csv`;
            link.click();
        }

        function importCSV(input) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const rows = e.target.result.split('\n').slice(1);
                rows.forEach(row => {
                    const c = row.split(';');
                    if(c.length >= 6) {
                        const id = c[0].replace("\uFEFF", "");
                        if(!mySets.some(s => s.setNumber === id)) {
                            mySets.push({
                                setNumber: id, name: c[1]?.replace(/"/g, ""), theme: c[2],
                                subtheme: c[3]?.replace(/"/g, ""), price: parseFloat(c[4]) || 0,
                                currentValue: parseFloat(c[5]) || 0, status: c[6] || "Used",
                                image: c[7] || "", pieces: 0, year: 0
                            });
                        }
                    }
                });
                saveAndRender();
            };
            reader.readAsText(input.files[0]);
        }

        renderLibrary();
    </script>
</body>
</html>
