<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brix Just4Sean - Collection Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); }
        
        .set-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: relative; }
        .set-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15); }
        
        .select-checkbox { opacity: 0; transition: all 0.2s; transform: scale(1.2); cursor: pointer; }
        .set-card:hover .select-checkbox, .select-checkbox:checked { opacity: 1; }

        @keyframes shimmerEffect { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        
        @keyframes hyperdrive {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(3); opacity: 0; }
        }

        .subtheme-starwars { 
            background: #000 !important;
            position: relative;
            overflow: hidden;
            color: #ffe81f !important;
            font-weight: 800;
            text-shadow: 0 0 5px rgba(255, 232, 31, 0.8);
            border: 1px solid #334155;
            z-index: 1;
        }

        .subtheme-starwars::before, .subtheme-starwars::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 100px; height: 100px;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 70% 40%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40% 80%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 80% 20%, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 10% 10%, #fff, rgba(0,0,0,0));
            animation: hyperdrive 1.2s linear infinite;
            z-index: -1;
        }
        .subtheme-starwars::after { animation-delay: 0.6s; }

        .subtheme-ucs { background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fcf6ba, #bf953f); background-size: 200% auto; color: #000; font-weight: 900; animation: shimmerEffect 4s linear infinite; }
        .subtheme-modular { background: linear-gradient(90deg, #065f46, #10b981, #064e3b, #10b981, #065f46); background-size: 200% auto; color: white; font-weight: 700; animation: shimmerEffect 4s linear infinite; }
        .subtheme-technic { background: #475569; color: white; }
        .subtheme-default { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

        #detailModal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div id="actionBar" class="fixed top-0 left-0 right-0 z-[60] bg-blue-600 text-white py-4 px-6 shadow-2xl hidden">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <span id="selectedCount" class="bg-white text-blue-600 px-3 py-1 rounded-full font-black text-sm">0</span>
                <p class="font-bold">Sets ausgewählt</p>
                <button onclick="clearSelection()" class="text-blue-100 hover:text-white text-xs underline">Abbrechen</button>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="refreshSelectedSets()" title="API Update" class="p-2 bg-blue-500 hover:bg-blue-400 rounded-lg transition-colors border border-blue-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="h-8 w-[1px] bg-blue-400 mx-1"></div>
                <select id="bulkStatus" class="bg-blue-700 rounded-lg px-3 py-2 text-sm font-bold outline-none border-none">
                    <option value="">Status...</option>
                    <option value="New">New</option>
                    <option value="Used">Used</option>
                </select>
                <button onclick="applyBulkActions()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-black text-sm hover:bg-blue-50">Anwenden</button>
                <button onclick="deleteSelected()" class="bg-red-500 hover:bg-red-600 p-2 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass mb-8 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="w-10 h-10 object-contain rounded-lg shadow-sm" onerror="this.style.display='none'">
                <h1 class="text-2xl font-extrabold text-slate-800">BRIX JUST<span class="text-blue-600">4SEAN™</span></h1>
            </div>
            
            <div class="flex gap-6 text-center">
                <div><p class="text-[10px] uppercase font-black text-slate-400">Sets</p><p id="statSets" class="font-bold text-slate-800">0</p></div>
                <div><p class="text-[10px] uppercase font-black text-slate-400">Teile</p><p id="statParts" class="font-bold text-slate-800">0</p></div>
                <div><p class="text-[10px] uppercase font-black text-slate-400">Sammlungswert</p><p id="statValue" class="font-bold text-blue-600">0.00 €</p></div>
            </div>

            <div class="flex gap-2 items-center">
                <button onclick="exportCollection()" title="Exportieren" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                    <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                </button>
                <label class="p-2 hover:bg-slate-100 rounded-xl transition-colors cursor-pointer" title="Importieren">
                    <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    <input type="file" id="importFile" class="hidden" accept=".json" onchange="importCollection(event)">
                </label>
                <div class="w-px h-6 bg-slate-200 mx-1"></div>
                <select id="filterCategory" onchange="renderLibrary()" class="bg-white border rounded-xl px-3 py-2 text-sm font-bold outline-none"><option value="all">Alle Themen</option></select>
                <input type="text" id="searchLibrary" oninput="renderLibrary()" placeholder="Suche (Set, Name, Barcode)..." class="bg-white border rounded-xl px-3 py-2 text-sm outline-none w-40 focus:w-64 transition-all">
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6">
        <div class="max-w-3xl mx-auto mb-16 text-center">
            <div class="bg-white p-2 rounded-[2.5rem] shadow-2xl flex items-center border-4 border-white">
                <input type="text" id="barcodeInput" autofocus class="flex-1 pl-8 pr-4 py-4 rounded-[2rem] text-xl outline-none" placeholder="Set-Nummer..." onkeydown="if(event.key === 'Enter') fetchSets()">
                <button onclick="fetchSets()" class="bg-blue-600 text-white font-bold py-4 px-10 rounded-[2rem] hover:bg-blue-700 transition-all">Hinzufügen</button>
            </div>
            <p id="apiStatus" class="mt-4 text-[10px] font-black text-slate-400 uppercase italic">Bereit</p>
        </div>
        <div id="library" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
    </main>

    <div id="detailModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 z-10"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            <div class="md:w-1/2 bg-slate-50 p-8 flex flex-col items-center justify-center border-r border-slate-100">
                <img id="modalImg" src="" class="max-h-64 object-contain drop-shadow-2xl mb-8">
                <div class="w-full text-center md:text-left">
                    <p class="text-xs font-black text-blue-600 uppercase tracking-widest" id="modalTheme"></p>
                    <h2 class="text-2xl font-extrabold text-slate-800" id="modalName"></h2>
                    <p class="text-slate-400 font-bold mt-1" id="modalId"></p>
                </div>
            </div>
            <div class="md:w-1/2 p-8 pt-12 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Barcode / EAN</p>
                        <input type="text" id="editEan" class="bg-transparent font-bold text-slate-800 w-full outline-none" placeholder="-">
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase">UVP Preis (€)</p>
                        <input type="number" id="editRetailPrice" step="0.01" class="bg-transparent font-bold text-slate-800 w-full outline-none">
                    </div>
                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 col-span-2">
                        <p class="text-[10px] font-black text-blue-500 uppercase">Marktwert (€)</p>
                        <input type="number" id="editCurrentValue" step="0.01" class="bg-transparent font-bold text-blue-700 w-full outline-none text-xl">
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl col-span-2">
                        <p class="text-[10px] font-black text-slate-400 uppercase">Subtheme (Tags)</p>
                        <input type="text" id="editSubtheme" class="bg-transparent font-bold text-slate-800 w-full outline-none" placeholder="z.B. UCS, Modular...">
                    </div>
                </div>
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Zustand</p>
                    <div class="flex gap-3">
                        <button onclick="setStatus('New')" id="btnNew" class="flex-1 py-3 rounded-xl border-2 font-bold transition-all">New</button>
                        <button onclick="setStatus('Used')" id="btnUsed" class="flex-1 py-3 rounded-xl border-2 font-bold transition-all">Used</button>
                    </div>
                </div>
                <button onclick="saveDetails()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition-all">Änderungen speichern</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY_BRICKSET = '3-N4Lr-Ug0H-M49ki';
        const API_KEY_REBRICKABLE = '74d1510666ec62fef948d197af293799';
        
        let mySets = JSON.parse(localStorage.getItem('bricksetCollection')) || [];
        let selectedSets = new Set();
        let currentEditId = null;
        let currentStatus = "Used";

        // EXPORT & IMPORT
        function exportCollection() {
            const dataStr = JSON.stringify(mySets, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `brix-collection-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importCollection(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        // Merge Strategie: Nur neue Sets hinzufügen
                        const existingIds = new Set(mySets.map(s => s.setNumber));
                        const newItems = imported.filter(s => !existingIds.has(s.setNumber));
                        mySets = [...newItems, ...mySets];
                        saveAndRender();
                        updateStatus(`${newItems.length} Sets importiert`, "text-green-600");
                    }
                } catch (err) {
                    updateStatus("Import fehlgeschlagen: Ungültige Datei", "text-red-600");
                }
            };
            reader.readAsText(file);
        }

        async function scrapeUVP(setNum) {
            try {
                const fullId = setNum.includes('-') ? setNum : `${setNum}-1`;
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent('https://www.brickeconomy.com/set/' + fullId + '/')}`;
                const response = await fetch(proxyUrl);
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const elements = doc.querySelectorAll('div, td, li, span, p');
                for (let el of elements) {
                    if (el.innerText && /retail price/i.test(el.innerText)) {
                        const match = el.innerText.match(/([0-9]+[\.,][0-9]{2})/);
                        if (match) return parseFloat(match[1].replace(',', '.'));
                    }
                }
            } catch (e) {}
            return 0;
        }

        function extractRRP(s) {
            const parsePrice = (val) => {
                if (!val) return 0;
                const parsed = parseFloat(String(val).replace(',', '.'));
                return isNaN(parsed) ? 0 : parsed;
            };
            let p = parsePrice(s.retailPrice);
            if (p > 0) return p;
            const regions = ['DE', 'UK', 'US'];
            for (let r of regions) {
                if (s.LEGOCom?.[r]?.retailPrice) {
                    p = parsePrice(s.LEGOCom[r].retailPrice);
                    if (p > 0) return p;
                }
            }
            return 0;
        }

        async function fetchFromRebrickable(query) {
            const setNum = query.includes('-') ? query : `${query}-1`;
            try {
                const res = await fetch(`https://rebrickable.com/api/v3/lego/sets/${setNum}/`, {
                    headers: { 'Authorization': `key ${API_KEY_REBRICKABLE}`, 'Accept': 'application/json' }
                });
                if(!res.ok) throw new Error();
                const data = await res.json();
                return {
                    setNumber: query,
                    name: data.name || "Unbekanntes Set",
                    pieces: data.num_parts || 0,
                    theme: "LEGO",
                    subtheme: "",
                    ean: "",
                    image: data.set_img_url || '',
                    price: 0, 
                    currentValue: 0,
                    status: "Used"
                };
            } catch (e) { return null; }
        }

        async function fetchSets() {
            const input = document.getElementById('barcodeInput');
            const query = input.value.trim();
            if (!query) return;
            updateStatus("Suche läuft...", "text-blue-500 animate-pulse");
            let newSetObj = null;
            try {
                const params = JSON.stringify({ query: query, pageSize: 1, extendedData: 1 });
                const url = `https://corsproxy.io/?${encodeURIComponent('https://brickset.com/api/v3.asmx/getSets?apiKey=' + API_KEY_BRICKSET + '&userHash=&params=' + params)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.status === "success" && data.matches > 0) {
                    const s = data.sets[0];
                    newSetObj = {
                        setNumber: String(s.number),
                        name: s.name,
                        pieces: s.pieces || 0,
                        theme: s.theme,
                        subtheme: s.subtheme || "",
                        ean: "",
                        image: s.image?.imageURL || '',
                        price: extractRRP(s), 
                        currentValue: 0,
                        status: "Used"
                    };
                    if (newSetObj.price === 0) newSetObj.price = await scrapeUVP(newSetObj.setNumber);
                } else {
                    newSetObj = await fetchFromRebrickable(query);
                    if (newSetObj) newSetObj.price = await scrapeUVP(newSetObj.setNumber);
                }
            } catch (e) {
                newSetObj = await fetchFromRebrickable(query);
            }

            if (newSetObj) {
                if(mySets.find(x => x.setNumber === newSetObj.setNumber)) {
                    updateStatus("Set existiert bereits!", "text-orange-600");
                } else {
                    mySets.unshift(newSetObj);
                    saveAndRender();
                    input.value = '';
                    updateStatus("Hinzugefügt!", "text-green-600");
                }
            } else {
                updateStatus("Nicht gefunden.", "text-red-600");
            }
        }

        async function refreshSelectedSets() {
            updateStatus("Aktualisiere...", "text-blue-600 animate-pulse");
            for (let id of selectedSets) {
                const s = mySets.find(x => x.setNumber === id);
                if (!s) continue;
                try {
                    const params = JSON.stringify({ query: s.setNumber, pageSize: 1, extendedData: 1 });
                    const url = `https://corsproxy.io/?${encodeURIComponent('https://brickset.com/api/v3.asmx/getSets?apiKey=' + API_KEY_BRICKSET + '&userHash=&params=' + params)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.matches > 0) {
                        const api = data.sets[0];
                        s.image = api.image?.imageURL || s.image;
                        s.subtheme = api.subtheme || s.subtheme;
                        let p = extractRRP(api);
                        if(p === 0) p = await scrapeUVP(s.setNumber);
                        if(p > 0) s.price = p;
                    }
                } catch(e) {}
            }
            saveAndRender(); clearSelection();
            updateStatus("Bereit", "text-slate-400");
        }

        function deleteSet(id, event) {
            if(event) event.stopPropagation();
            // Bestätigung entfernt
            mySets = mySets.filter(s => s.setNumber !== id);
            selectedSets.delete(id);
            saveAndRender();
            updateActionBar();
        }

        function renderLibrary() {
            const term = document.getElementById('searchLibrary').value.toLowerCase();
            const cat = document.getElementById('filterCategory').value;
            
            const filtered = mySets.filter(s => {
                const matchSearch = s.name.toLowerCase().includes(term) || 
                                   s.setNumber.includes(term) || 
                                   (s.subtheme && s.subtheme.toLowerCase().includes(term)) ||
                                   (s.ean && s.ean.toLowerCase().includes(term)); // Barcode Suche
                const matchCat = (cat === "all" || s.theme === cat);
                return matchSearch && matchCat;
            });
            
            document.getElementById('library').innerHTML = filtered.map(set => `
                <div onclick="openModal('${set.setNumber}')" class="set-card bg-white rounded-[2rem] shadow-lg border border-slate-100 overflow-hidden">
                    <input type="checkbox" ${selectedSets.has(set.setNumber) ? 'checked' : ''} onclick="toggleSelection('${set.setNumber}', event)" class="select-checkbox absolute top-5 left-5 z-20 w-5 h-5 rounded-md accent-blue-600">
                    <button onclick="deleteSet('${set.setNumber}', event)" class="absolute top-4 right-4 z-20 p-2 bg-red-50 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                    <div class="h-48 flex items-center justify-center p-6 relative">
                        <img src="${set.image}" class="max-h-full object-contain drop-shadow-xl" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="absolute bottom-2 left-4 flex gap-1 flex-wrap pr-4">
                            <span class="text-[8px] font-bold px-2 py-0.5 rounded-full ${set.status === 'New' ? 'bg-blue-600' : 'bg-slate-700'} text-white">${set.status}</span>
                            ${set.subtheme ? `<span class="text-[8px] px-2 py-0.5 rounded-full ${getSubthemeClass(set.subtheme)}">${set.subtheme}</span>` : ''}
                        </div>
                    </div>
                    <div class="p-6 pt-2">
                        <span class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase">${set.theme}</span>
                        <h3 class="font-bold text-slate-800 text-sm mt-2 h-10 overflow-hidden">${set.name}</h3>
                        <div class="flex justify-between items-end border-t mt-4 pt-4">
                            <div class="text-[10px] text-slate-400 font-bold uppercase">
                                <p class="text-slate-700">#${set.setNumber}</p>
                                <p class="${set.price === 0 ? 'text-red-500 font-black' : ''}">UVP: ${parseFloat(set.price || 0).toFixed(2)} €</p>
                            </div>
                            <div class="text-right"><p class="text-[9px] font-black text-slate-300 uppercase">Marktwert</p><p class="text-xl font-extrabold text-blue-600">${parseFloat(set.currentValue || 0).toFixed(2)} €</p></div>
                        </div>
                    </div>
                </div>
            `).join('');
            updateStats();
        }

        function getSubthemeClass(sub) {
            const s = sub.toLowerCase();
            if(s.includes("star wars")) return "subtheme-starwars";
            if(s.includes("ucs") || s.includes("ultimate collector")) return "subtheme-ucs";
            if(s.includes("modular")) return "subtheme-modular";
            if(s.includes("technic")) return "subtheme-technic";
            return "subtheme-default";
        }

        function setStatus(s) { 
            currentStatus = s; 
            document.getElementById('btnNew').className = s === 'New' ? "flex-1 py-3 rounded-xl border-2 font-bold bg-blue-600 text-white border-blue-600" : "flex-1 py-3 rounded-xl border-2 font-bold bg-white text-slate-400 border-slate-100"; 
            document.getElementById('btnUsed').className = s === 'Used' ? "flex-1 py-3 rounded-xl border-2 font-bold bg-slate-800 text-white border-slate-800" : "flex-1 py-3 rounded-xl border-2 font-bold bg-white text-slate-400 border-slate-100"; 
        }

        function openModal(id) {
            const s = mySets.find(x => x.setNumber === id);
            currentEditId = id;
            document.getElementById('modalImg').src = s.image;
            document.getElementById('modalName').innerText = s.name;
            document.getElementById('modalTheme').innerText = s.theme;
            document.getElementById('modalId').innerText = "#" + s.setNumber;
            document.getElementById('editEan').value = s.ean || "";
            document.getElementById('editRetailPrice').value = s.price || 0;
            document.getElementById('editCurrentValue').value = s.currentValue || 0;
            document.getElementById('editSubtheme').value = s.subtheme || "";
            setStatus(s.status || "Used");
            document.getElementById('detailModal').style.display = 'flex';
        }

        function saveDetails() {
            const s = mySets.find(x => x.setNumber === currentEditId);
            if(s) {
                s.ean = document.getElementById('editEan').value;
                s.price = parseFloat(document.getElementById('editRetailPrice').value) || 0;
                s.currentValue = parseFloat(document.getElementById('editCurrentValue').value) || 0;
                s.subtheme = document.getElementById('editSubtheme').value;
                s.status = currentStatus;
                saveAndRender(); closeModal();
            }
        }

        function toggleSelection(id, event) { event.stopPropagation(); if (selectedSets.has(id)) selectedSets.delete(id); else selectedSets.add(id); updateActionBar(); }
        function updateActionBar() { document.getElementById('selectedCount').innerText = selectedSets.size; document.getElementById('actionBar').classList.toggle('hidden', selectedSets.size === 0); }
        function clearSelection() { selectedSets.clear(); updateActionBar(); renderLibrary(); }
        function saveAndRender() { localStorage.setItem('bricksetCollection', JSON.stringify(mySets)); updateCategories(); renderLibrary(); }
        
        function updateStats() { 
            const p = mySets.reduce((a, b) => a + (parseInt(b.pieces) || 0), 0);
            const v = mySets.reduce((a, b) => a + (parseFloat(b.currentValue) || 0), 0);
            document.getElementById('statSets').innerText = mySets.length;
            document.getElementById('statParts').innerText = p.toLocaleString();
            document.getElementById('statValue').innerText = v.toFixed(2) + " €";
        }

        function updateCategories() { 
            const ts = [...new Set(mySets.map(s => s.theme))].sort(); 
            const sel = document.getElementById('filterCategory'); 
            const cur = sel.value;
            sel.innerHTML = '<option value="all">Alle Themen</option>' + ts.map(t => `<option value="${t}" ${t===cur?'selected':''}>${t}</option>`).join(''); 
        }

        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }
        function updateStatus(m, c) { const el = document.getElementById('apiStatus'); el.innerText = m; el.className = `mt-4 text-[10px] font-black uppercase italic ${c}`; }
        
        function deleteSelected() { 
            // Bestätigung entfernt
            mySets = mySets.filter(s => !selectedSets.has(s.setNumber)); 
            clearSelection(); saveAndRender(); 
        }
        
        function applyBulkActions() { 
            const st = document.getElementById('bulkStatus').value; 
            mySets.forEach(s => { if(selectedSets.has(s.setNumber)) if(st) s.status = st; }); 
            clearSelection(); saveAndRender(); 
        }

        saveAndRender();
    </script>
</body>
</html>
