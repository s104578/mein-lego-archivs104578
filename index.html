<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brickset Collector Cloud PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.4); }
        .set-card { transition: all 0.4s ease; cursor: pointer; position: relative; }
        .set-card:hover { transform: translateY(-5px); }
        .set-card.selected { border: 3px solid #2563eb; background-color: #eff6ff; }
        #detailModal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .selection-badge { display: none; }
        .has-selection .selection-badge { display: flex; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <div id="detailModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 z-10">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <div class="md:w-1/2 bg-slate-50 p-8 flex flex-col items-center justify-center border-r border-slate-100">
                <img id="modalImg" src="" class="max-h-64 object-contain drop-shadow-2xl mb-8">
                <div class="w-full text-center md:text-left">
                    <p class="text-xs font-black text-blue-600 uppercase tracking-widest" id="modalTheme"></p>
                    <h2 class="text-2xl font-extrabold text-slate-800" id="modalName"></h2>
                    <p class="text-slate-400 font-bold" id="modalId"></p>
                </div>
            </div>

            <div class="md:w-1/2 p-8 pt-12 space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-slate-400 uppercase">UVP (RRP)</p>
                        <input type="number" id="editRRP" step="0.01" class="bg-transparent font-bold text-slate-800 w-full outline-none">
                    </div>
                    <div class="bg-blue-50 p-4 rounded-2xl">
                        <p class="text-[10px] font-black text-blue-500 uppercase">Current Value</p>
                        <input type="number" id="editCurrentValue" step="0.01" class="bg-transparent font-bold text-blue-700 w-full outline-none">
                    </div>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Subtheme</p>
                    <input type="text" id="editSubtheme" class="bg-transparent font-bold text-slate-800 w-full outline-none">
                </div>
                <div>
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-3">Zustand</p>
                    <div class="flex gap-3">
                        <button onclick="setStatus('New')" id="btnNew" class="flex-1 py-3 rounded-xl border-2 font-bold transition-all">New</button>
                        <button onclick="setStatus('Used')" id="btnUsed" class="flex-1 py-3 rounded-xl border-2 font-bold transition-all">Used</button>
                    </div>
                </div>
                <button onclick="saveDetails()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg">Speichern</button>
            </div>
        </div>
    </div>

    <nav class="sticky top-0 z-50 glass border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">BRICKSET<span class="text-blue-600">DB</span></h1>
            </div>

            <div id="selectionBar" class="selection-badge items-center gap-4 bg-blue-600 text-white px-6 py-2 rounded-full shadow-xl animate-bounce">
                <span id="selectCount" class="font-bold text-sm">0 Sets gewählt</span>
                <div class="h-4 w-px bg-blue-400"></div>
                <button onclick="bulkEdit()" class="text-xs font-black uppercase hover:underline">Massen-Edit</button>
                <button onclick="bulkDelete()" class="text-xs font-black uppercase hover:underline text-red-200">Löschen</button>
                <button onclick="clearSelection()" class="text-xs font-black uppercase bg-white/20 p-1 rounded px-2">X</button>
            </div>

            <div class="flex gap-4">
                <div class="text-center">
                    <p class="text-[10px] uppercase font-black text-slate-400">Sammlungswert</p>
                    <p id="statValue" class="font-bold text-blue-600">0.00 €</p>
                </div>
                <button onclick="exportCSV()" class="bg-slate-100 p-2 rounded-xl text-slate-600 font-bold text-xs">CSV Export</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 mt-8">
        <div class="max-w-2xl mx-auto mb-12">
            <div class="bg-white p-2 rounded-full shadow-xl flex border-4 border-white">
                <input type="text" id="barcodeInput" class="flex-1 pl-6 outline-none text-lg" placeholder="Set-Nr scannen...">
                <button onclick="fetchFromBrickset()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold">Hinzufügen</button>
            </div>
            <p id="apiStatus" class="text-center mt-3 text-[10px] font-black uppercase text-slate-400 italic">Bereit</p>
        </div>

        <div id="library" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </main>

    <script>
        const API_KEY = '3-N4Lr-Ug0H-M49ki';
        let mySets = JSON.parse(localStorage.getItem('bricksetCollection')) || [];
        let selectedSets = new Set();
        let currentEditId = null;
        let currentStatus = "Used";

        async function fetchFromBrickset() {
            const query = document.getElementById('barcodeInput').value.trim();
            if (!query) return;
            const url = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://brickset.com/api/v3.asmx/getSets?apiKey=${API_KEY}&userHash=&params={'query':'${query}'}`)}`;
            
            try {
                const response = await fetch(url);
                const raw = await response.json();
                const data = JSON.parse(raw.contents);
                if (data.matches > 0) {
                    addSet(data.sets[0]);
                    document.getElementById('barcodeInput').value = '';
                }
            } catch (e) { console.error("API Error"); }
        }

        function addSet(set) {
            // Währungs-Logik: DE Preis bevorzugt, sonst US Dollar als Euro nutzen
            let rrp = 0;
            if (set.LEGOCom && set.LEGOCom.DE && set.LEGOCom.DE.retailPrice) {
                rrp = parseFloat(set.LEGOCom.DE.retailPrice);
            } else if (set.LEGOCom && set.LEGOCom.US && set.LEGOCom.US.retailPrice) {
                rrp = parseFloat(set.LEGOCom.US.retailPrice);
            }

            mySets.unshift({
                setNumber: set.number,
                name: set.name,
                theme: set.theme,
                subtheme: set.subtheme || "",
                pieces: set.pieces || 0,
                year: set.year,
                image: set.image?.imageURL || '',
                price: rrp || 0,
                currentValue: rrp || 0,
                status: "Used",
                addedAt: new Date().toLocaleDateString()
            });
            saveAndRender();
        }

        function toggleSelect(id, event) {
            event.stopPropagation();
            if (selectedSets.has(id)) selectedSets.delete(id);
            else selectedSets.add(id);
            updateSelectionUI();
            renderLibrary();
        }

        function updateSelectionUI() {
            const bar = document.body;
            if (selectedSets.size > 0) {
                bar.classList.add('has-selection');
                document.getElementById('selectCount').innerText = `${selectedSets.size} Sets gewählt`;
            } else {
                bar.classList.remove('has-selection');
            }
        }

        function clearSelection() {
            selectedSets.clear();
            updateSelectionUI();
            renderLibrary();
        }

        function bulkDelete() {
            if (confirm(`${selectedSets.size} Sets endgültig löschen?`)) {
                mySets = mySets.filter(s => !selectedSets.has(s.setNumber));
                clearSelection();
                saveAndRender();
            }
        }

        function bulkEdit() {
            const newSub = prompt("Neues Subtheme für alle markierten Sets:");
            const newStatus = confirm("Zustand auf 'New' setzen? (Abbrechen für 'Used')") ? "New" : "Used";
            mySets.forEach(s => {
                if (selectedSets.has(s.setNumber)) {
                    if (newSub !== null) s.subtheme = newSub;
                    s.status = newStatus;
                }
            });
            clearSelection();
            saveAndRender();
        }

        function openModal(id) {
            if (selectedSets.size > 0) return; 
            const set = mySets.find(s => s.setNumber === id);
            currentEditId = id;
            document.getElementById('modalImg').src = set.image;
            document.getElementById('modalName').innerText = set.name;
            document.getElementById('modalId').innerText = "#" + set.setNumber;
            document.getElementById('editRRP').value = set.price;
            document.getElementById('editCurrentValue').value = set.currentValue;
            document.getElementById('editSubtheme').value = set.subtheme;
            setStatus(set.status);
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('detailModal').style.display = 'none'; }

        function setStatus(s) {
            currentStatus = s;
            document.getElementById('btnNew').className = s === 'New' ? "flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold" : "flex-1 py-3 rounded-xl border-2 font-bold text-slate-400";
            document.getElementById('btnUsed').className = s === 'Used' ? "flex-1 py-3 rounded-xl bg-slate-800 text-white font-bold" : "flex-1 py-3 rounded-xl border-2 font-bold text-slate-400";
        }

        function saveDetails() {
            const set = mySets.find(s => s.setNumber === currentEditId);
            set.price = parseFloat(document.getElementById('editRRP').value) || 0;
            set.currentValue = parseFloat(document.getElementById('editCurrentValue').value) || 0;
            set.subtheme = document.getElementById('editSubtheme').value;
            set.status = currentStatus;
            saveAndRender();
            closeModal();
        }

        function renderLibrary() {
            const container = document.getElementById('library');
            container.innerHTML = mySets.map(set => `
                <div onclick="openModal('${set.setNumber}')" class="set-card bg-white rounded-[2rem] p-6 shadow-sm border ${selectedSets.has(set.setNumber) ? 'border-blue-500 ring-4 ring-blue-100 shadow-lg' : 'border-slate-100'}">
                    <input type="checkbox" onclick="toggleSelect('${set.setNumber}', event)" ${selectedSets.has(set.setNumber) ? 'checked' : ''} class="absolute top-4 right-4 w-6 h-6 rounded-lg accent-blue-600 cursor-pointer z-10">
                    <div class="h-40 flex items-center justify-center mb-4">
                        <img src="${set.image}" class="max-h-full drop-shadow-lg">
                    </div>
                    <span class="text-[9px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded uppercase tracking-widest">${set.theme}</span>
                    <h3 class="font-bold text-slate-800 text-sm mt-2 h-10 overflow-hidden leading-tight">${set.name}</h3>
                    <div class="flex justify-between items-end mt-4 pt-4 border-t border-slate-50">
                        <div class="text-[10px] text-slate-400 font-bold uppercase leading-tight">
                            <p class="text-slate-700 font-bold">#${set.setNumber}</p>
                            <p>${set.pieces} Teile</p>
                            <p>UVP: ${set.price.toFixed(2)} €</p>
                        </div>
                        <div class="text-right">
                             <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Marktwert</p>
                             <p class="text-xl font-extrabold text-blue-600 leading-none">${set.currentValue.toFixed(2)} €</p>
                        </div>
                    </div>
                </div>
            `).join('');
            updateStats();
        }

        function updateStats() {
            // Rechnet nun mit dem Current Value für den Gesamtwert
            const total = mySets.reduce((sum, s) => sum + (s.currentValue || 0), 0);
            document.getElementById('statValue').innerText = total.toFixed(2) + " €";
        }

        function saveAndRender() {
            localStorage.setItem('bricksetCollection', JSON.stringify(mySets));
            renderLibrary();
        }

        function exportCSV() {
            let csv = "Set-Nr;Name;Theme;UVP;Current Value;Zustand\n";
            mySets.forEach(s => {
                csv += `${s.setNumber};${s.name};${s.theme};${s.price};${s.currentValue};${s.status}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'collection.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        renderLibrary();
    </script>
</body>
</html>
